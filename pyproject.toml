[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-sdk"
version = "1.0.0"
description = "Python client and visualization tools for Grounded multimodal assets"
readme = "README.md"
license = "Apache-2.0"
authors = [
  { name="Vincent Liu", email="vincent@gsi.company" }
]
requires-python = ">=3.10"
keywords = ["robotics", "multimodal", "computer-vision", "datasets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/grounded-superintelligence/grounded"
Documentation = "https://github.com/grounded-superintelligence/grounded#readme"
Repository = "https://github.com/grounded-superintelligence/grounded"
Issues = "https://github.com/grounded-superintelligence/grounded/issues"

[project.optional-dependencies]
s3 = [
    "boto3>=1.34",
    "botocore[crt]>=1.34",
]
visualization = [
    "boto3>=1.34",
    "botocore[crt]>=1.34",
    "filelock",
    "imageio",
    "imageio-ffmpeg",
    "numpy>2",
    "opencv-python",
    "rerun-sdk",
    "scipy",
    "tqdm",
]
dev = [
    "build>=1.2",
    "filelock",
    "numpy>2",
    "opencv-python",
    "pre-commit",
    "pytest>=8",
    "ruff",
    "twine>=5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["grounded*"]
exclude = ["admin"]

[tool.ruff]
indent-width = 4
line-length = 127
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E722", "E741"]

[tool.ruff.lint.isort]
combine-as-imports = true
from-first = false
known-first-party = ["src"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false
