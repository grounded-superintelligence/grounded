name: SDK checks

on:
  pull_request:
  push:
    branches:
      - v1.0.0

permissions:
  contents: read

jobs:
  core:
    name: Core client / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest ruff
      - run: python -m pytest tests/test_processing.py tests/test_episodes.py
      - run: python -m ruff check src tests demo_v0.py demo_v1.py

  package:
    name: Build and inspect distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          assert "grounded/processing.py" in names
          assert not any(name.startswith("tests/") for name in names)
          print(f"verified {wheel.name}: {len(names)} files")
          PY
      - name: Smoke-test the core wheel
        run: |
          python -m venv /tmp/grounded-wheel-smoke
          /tmp/grounded-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          /tmp/grounded-wheel-smoke/bin/python -c "from grounded.processing import ProcessingClient; print(ProcessingClient)"
